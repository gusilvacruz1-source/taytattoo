# Publica o site no GitHub Pages a cada push na main.
#
# O site é estático e mora na raiz do repositório: não há nada para
# compilar, então o workflow só empacota a pasta e entrega.
#
# O "enablement: true" liga o GitHub Pages sozinho na primeira vez, sem
# precisar mexer em Settings. Se a organização bloquear isso, é só ligar
# à mão em Settings > Pages e rodar o workflow de novo.

name: Publica no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez, sem cancelar a que já está em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.entrega.outputs.page_url }}
    steps:
      - name: Baixa o repositório
        uses: actions/checkout@v4

      - name: Liga e configura o Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empacota a raiz do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Entrega
        id: entrega
        uses: actions/deploy-pages@v4
